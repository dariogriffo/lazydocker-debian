name: Build lazydocker for Debian

on:
  workflow_dispatch:
    inputs:
      lazydocker_version:
        description: The version of lazydocker to build.
        type: string
        required: true
      build_version:
        description: The build version.
        type: string
        required: true
      architecture:
        description: Architecture to build (amd64, arm64, or 'all' for all architectures)
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
          - 'armhf'
          - 'armel'
          - 'i386'

permissions:
  contents: write

jobs:
  build-lazydocker:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lazydocker-debian
        uses: actions/checkout@v4

      - name: Validate upstream license permits paid distribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./validate_license.sh ${{ inputs.lazydocker_version }}

      - name: Build lazydocker
        run: ./build.sh ${{ inputs.lazydocker_version }} ${{ inputs.build_version }} ${{ inputs.architecture }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: lazydocker_*.deb

  build-src:
    name: Build Source Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lazydocker-debian
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev devscripts wget ca-certificates

      - name: Build source packages
        run: ./build_src.sh ${{ inputs.lazydocker_version }} ${{ inputs.build_version }}

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-artifact
          path: |
            lazydocker_*.dsc
            lazydocker_*.orig.tar.gz
            lazydocker_*.debian.tar.xz

  release-lazydocker:
    name: Release lazydocker for Debian
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-lazydocker, build-src]
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-artifact

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            lazydocker_*.deb
            lazydocker_*.dsc
            lazydocker_*.orig.tar.gz
            lazydocker_*.debian.tar.xz
          name: ${{ inputs.lazydocker_version }}+${{ inputs.build_version }}
          tag_name: ${{ inputs.lazydocker_version }}+${{ inputs.build_version }}
          fail_on_unmatched_files: true
